name: servicehub_mobile
description: ServiceHub Tunisie - Super App pour Services du Quotidien
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  dio: ^5.4.0
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Maps & Location
  google_maps_flutter: ^2.5.3
  location: ^5.0.3
  geocoding: ^2.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # UI Components
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6

  # Forms & Validation
  flutter_form_builder: ^9.1.1

  # Navigation
  go_router: ^13.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.2

  # Date & Time
  timeago: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
